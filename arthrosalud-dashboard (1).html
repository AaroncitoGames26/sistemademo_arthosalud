<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArthroSalud — Sistema de Gestión</title>
<style>
  :root{
    --azul-900:#0f2a4a;
    --azul-700:#1c4a7a;
    --azul-500:#2f6bab;
    --azul-100:#eaf1f8;
    --naranja-600:#e07a1f;
    --naranja-400:#f4993d;
    --gris-900:#1c2430;
    --gris-600:#5b6675;
    --gris-300:#d9dee5;
    --gris-100:#f3f5f8;
    --blanco:#ffffff;
    --radio:10px;
    --sombra:0 1px 3px rgba(15,42,74,.08), 0 1px 2px rgba(15,42,74,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--gris-100);
    color:var(--gris-900);
  }

  /* TOP BAR */
  header.topbar{
    background:var(--blanco);
    border-bottom:1px solid var(--gris-300);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 24px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .marca{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .marca .icono{
    width:38px;height:38px;border-radius:8px;
    background:linear-gradient(135deg,var(--azul-700),var(--azul-500));
    display:flex;align-items:center;justify-content:center;
    color:white;font-weight:700;font-size:16px;
  }
  .marca h1{
    font-size:15px;
    margin:0;
    line-height:1.25;
    color:var(--azul-900);
    font-weight:700;
    letter-spacing:.2px;
  }
  .marca p{
    margin:0;
    font-size:10.5px;
    color:var(--naranja-600);
    font-weight:600;
  }
  .usuario-btn{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--gris-300);
    background:var(--blanco);
    padding:8px 14px;
    border-radius:8px;
    font-weight:600;
    font-size:13px;
    color:var(--gris-900);
    cursor:pointer;
  }
  .usuario-btn:hover{ border-color:var(--azul-500); color:var(--azul-700); }
  .btn-menu-movil{ display:none; width:38px; height:38px; border:1px solid var(--gris-300); border-radius:8px; background:var(--blanco); color:var(--azul-900); cursor:pointer; font-size:20px; }
  .perfil{ position:relative; }
  .menu-perfil{ display:none; position:absolute; top:calc(100% + 8px); right:0; min-width:190px; padding:7px; background:var(--blanco); border:1px solid var(--gris-300); border-radius:10px; box-shadow:0 8px 20px rgba(15,42,74,.14); z-index:40; }
  .perfil.abierto .menu-perfil{ display:block; }
  .opcion-perfil{ display:flex; align-items:center; justify-content:space-between; width:100%; padding:10px 11px; border:0; border-radius:7px; background:transparent; color:var(--gris-900); cursor:pointer; text-align:left; font-size:13px; }
  .opcion-perfil:hover,.opcion-perfil.seleccionado{ background:var(--azul-100); color:var(--azul-700); }
  .opcion-perfil.seleccionado:after{ content:'✓'; color:var(--naranja-600); font-weight:800; }

  /* LAYOUT */
  .layout{
    display:grid;
    grid-template-columns:260px 1fr;
    min-height:calc(100vh - 61px);
  }
  nav.sidebar{
    background:var(--blanco);
    border-right:1px solid var(--gris-300);
    padding:18px 12px;
    overflow-y:auto;
  }
  nav.sidebar h2{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--gris-600);
    margin:6px 10px 10px;
    font-weight:700;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    color:var(--gris-900);
    margin-bottom:2px;
    border-left:3px solid transparent;
    transition:background .12s ease;
  }
  .nav-item:hover{ background:var(--azul-100); }
  .nav-item.activo{
    background:var(--azul-100);
    border-left-color:var(--naranja-600);
    color:var(--azul-700);
  }
  .nav-item .punto{
    width:8px;height:8px;border-radius:50%;
    background:var(--gris-300);
    flex-shrink:0;
  }
  .nav-item.activo .punto{ background:var(--naranja-600); }

  main{
    padding:26px 30px 60px;
  }

  /* VISTA MODULOS (grid) */
  .encabezado-modulos{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .encabezado-modulos h2{
    font-size:22px;
    color:var(--azul-700);
    margin:0;
    font-weight:700;
  }
  .encabezado-modulos span{
    font-size:12.5px;
    color:var(--gris-600);
  }
  .grid-modulos{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:16px;
  }
  .tarjeta-modulo{
    background:var(--blanco);
    border:1px solid var(--gris-300);
    border-radius:var(--radio);
    padding:22px 14px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    cursor:pointer;
    box-shadow:var(--sombra);
    transition:transform .1s ease, border-color .1s ease;
  }
  .tarjeta-modulo:hover{
    border-color:var(--azul-500);
    transform:translateY(-2px);
  }
  .tarjeta-modulo .badge-icono{
    width:52px;height:52px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
  }
  .tarjeta-modulo span.nombre{
    font-size:13px;
    font-weight:700;
    color:var(--azul-700);
    text-align:center;
  }
  .tarjeta-modulo.bloqueado{ opacity:.55; cursor:not-allowed; }
  .tarjeta-modulo.bloqueado:hover{ transform:none; border-color:var(--gris-300); }

  /* VISTA DE DETALLE DE MODULO */
  .panel-detalle{
    background:var(--blanco);
    border:1px solid var(--gris-300);
    border-radius:var(--radio);
    padding:0;
    overflow:hidden;
  }
  .panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 22px;
    border-bottom:1px solid var(--gris-300);
    background:linear-gradient(90deg,var(--azul-100),var(--blanco));
  }
  .panel-header h2{
    margin:0;
    font-size:19px;
    color:var(--azul-900);
  }
  .btn-volver{
    background:var(--blanco);
    border:1px solid var(--gris-300);
    padding:7px 12px;
    border-radius:7px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--gris-900);
  }
  .btn-volver:hover{ border-color:var(--azul-500); color:var(--azul-700); }
  .panel-body{ padding:20px 22px 28px; }
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .toolbar input[type=text]{
    flex:1;
    min-width:180px;
    padding:9px 12px;
    border:1px solid var(--gris-300);
    border-radius:7px;
    font-size:13px;
  }
  .btn-primario{
    background:var(--naranja-600);
    color:white;
    border:none;
    padding:9px 16px;
    border-radius:7px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primario:hover{ background:var(--naranja-400); }

  table.datos{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  table.datos th{
    text-align:left;
    background:var(--azul-100);
    color:var(--azul-900);
    padding:10px 12px;
    font-weight:700;
    border-bottom:1px solid var(--gris-300);
  }
  table.datos td{
    padding:10px 12px;
    border-bottom:1px solid var(--gris-100);
    color:var(--gris-900);
  }
  table.datos tr:hover td{ background:var(--gris-100); }
  .estado{
    display:inline-block;
    padding:3px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
  }
  .estado.ok{ background:#e5f6ea; color:#1e8a3c; }
  .estado.pendiente{ background:#fdf1de; color:var(--naranja-600); }
  .estado.alerta{ background:#fdeaea; color:#c93a3a; }

  .kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px;
    margin-bottom:20px;
  }
  .kpi{
    background:var(--gris-100);
    border:1px solid var(--gris-300);
    border-radius:8px;
    padding:14px 16px;
  }
  .kpi .valor{ font-size:22px; font-weight:800; color:var(--azul-700); }
  .kpi .etiqueta{ font-size:11.5px; color:var(--gris-600); font-weight:600; margin-top:2px; }

  .vacio{
    text-align:center;
    padding:50px 20px;
    color:var(--gris-600);
  }
  .vacio .icono-vacio{ font-size:38px; margin-bottom:10px; }

  footer.statusbar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--azul-900);
    color:#cfe0f0;
    font-size:12px;
    padding:8px 20px;
  }

  @media (max-width:1100px) and (min-width:821px){
    .layout{ grid-template-columns:220px 1fr; }
    main{ padding:22px 20px 60px; }
    nav.sidebar{ padding-left:9px; padding-right:9px; }
    .nav-item{ font-size:13px; }
    .grid-modulos{ grid-template-columns:repeat(auto-fill,minmax(135px,1fr)); gap:12px; }
  }
  @media (max-width:820px){
    header.topbar{ padding:9px 16px; }
    .btn-menu-movil{ display:block; }
    .marca{ min-width:0; }
    .marca h1{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .marca p{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .topbar > .perfil{ margin-left:auto; }
    .layout{ display:block; min-height:calc(100vh - 61px); }
    nav.sidebar{ display:block; position:fixed; top:61px; bottom:0; left:0; width:min(290px,84vw); z-index:35; transform:translateX(-105%); transition:transform .2s ease; box-shadow:8px 0 24px rgba(15,42,74,.14); }
    nav.sidebar.abierto{ transform:translateX(0); }
    main{ padding:22px 20px 60px; }
    .grid-modulos{ grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:12px; }
    .panel-header{ gap:12px; padding:15px 17px; }
    .panel-header h2{ font-size:17px; }
    .navbar-interna{ padding:9px 14px; }
  }
  @media (max-width:520px){
    header.topbar{ padding:8px 11px; }
    .marca{ gap:7px; }
    .marca .icono{ width:34px; height:34px; font-size:14px; }
    .marca h1{ font-size:13px; }
    .marca p{ font-size:9px; }
    .usuario-btn{ padding:7px 9px; font-size:11px; }
    .btn-menu-movil{ width:34px; height:34px; font-size:18px; }
    nav.sidebar{ top:57px; }
    main{ padding:18px 12px 58px; }
    .encabezado-modulos{ align-items:flex-start; flex-direction:column; gap:4px; }
    .grid-modulos{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .tarjeta-modulo{ padding:16px 8px 13px; }
    .tarjeta-modulo .badge-icono{ width:44px; height:44px; font-size:20px; }
    .panel-body{ padding:15px 13px 22px; }
    .panel-header{ align-items:flex-start; flex-direction:column; }
    .btn-volver{ width:100%; }
    .navbar-interna{ gap:4px; padding:8px 10px; }
    .menu-superior > button{ font-size:12px; padding:7px 8px; }
    .submenu{ position:fixed; left:12px; right:12px; top:115px; min-width:0; max-height:60vh; overflow:auto; }
    .vista-seccion{ padding:22px 12px; }
    .crud-heading h3{ font-size:21px; }
    .crud-toolbar{ padding:14px 13px; }
    .crud-footer{ padding:13px; }
    .paginacion{ justify-content:flex-end; }
    .pendiente{ align-items:flex-start; flex-wrap:wrap; }
    .pendiente .etiqueta-pendiente{ margin-left:18px; }
  }

  /* NAVBAR INTERNA DEL MODULO (Ficheros, Pacientes, Citas...) */
  .navbar-interna{
    display:flex;
    align-items:center;
    gap:2px;
    padding:12px 22px;
    border-bottom:1px solid var(--gris-300);
    background:var(--blanco);
    position:relative;
    flex-wrap:wrap;
  }
  .menu-superior{ position:relative; }
  .menu-superior > button{
    background:none;
    border:none;
    font-size:14px;
    font-weight:600;
    color:var(--gris-900);
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .menu-superior > button:hover,
  .menu-superior.abierto > button{
    background:var(--azul-100);
    color:var(--azul-700);
  }
  .menu-superior > button .flecha{
    font-size:9px;
    transition:transform .12s ease;
    color:var(--gris-600);
  }
  .menu-superior.abierto > button .flecha{ transform:rotate(180deg); }

  .submenu{
    display:none;
    position:absolute;
    top:calc(100% + 4px);
    left:0;
    background:var(--gris-100);
    border:1px solid var(--gris-300);
    border-radius:8px;
    min-width:230px;
    padding:10px 0;
    box-shadow:0 8px 20px rgba(15,42,74,.12);
    z-index:30;
  }
  .menu-superior.abierto .submenu{ display:block; }
  .submenu a{
    display:block;
    padding:9px 20px;
    font-size:13.5px;
    text-decoration:none;
    color:var(--azul-700);
    font-weight:500;
  }
  .submenu a:hover{ background:var(--azul-100); }
  .submenu a.acento{ color:var(--naranja-600); }
  .submenu .vacio-submenu{
    padding:9px 20px;
    font-size:12.5px;
    color:var(--gris-600);
    font-style:italic;
  }

  .vista-seccion{
    padding:36px 30px;
  }
  .vista-seccion .migaja{
    font-size:12px;
    color:var(--gris-600);
    margin-bottom:6px;
  }
  .vista-seccion .migaja b{ color:var(--azul-700); }
  .vista-seccion h3{
    margin:0 0 18px;
    font-size:20px;
    color:var(--azul-900);
  }
  /* CRUD DE FICHEROS */
  .crud-shell{ max-width:1100px; margin:0 auto; }
  .crud-heading{ display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:18px; }
  .crud-heading h3{ margin:0 0 5px; font-size:25px; color:var(--azul-700); }
  .crud-heading p{ margin:0; font-size:13px; color:var(--gris-600); }
  .crud-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .btn-secundario,.btn-icono{ background:var(--blanco); border:1px solid var(--gris-300); color:var(--gris-900); cursor:pointer; font-weight:700; }
  .btn-secundario{ padding:10px 16px; border-radius:8px; font-size:13px; }
  .btn-secundario:hover,.btn-icono:hover{ border-color:var(--azul-500); color:var(--azul-700); }
  .btn-peligro{ margin-right:auto; padding:10px 13px; border:1px solid #efb8b8; border-radius:8px; background:#fff7f7; color:#bd3d3d; cursor:pointer; font-size:12px; font-weight:700; }
  .btn-peligro:hover{ background:#fdeaea; }
  .btn-icono{ width:36px; height:36px; border-radius:8px; font-size:19px; line-height:1; }
  .crud-panel{ background:var(--blanco); border:1px solid var(--gris-300); border-radius:12px; box-shadow:var(--sombra); overflow:hidden; }
  .crud-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px 20px; border-bottom:1px solid var(--gris-300); }
  .filtro{ position:relative; flex:1; }
  .filtro label{ position:absolute; top:-8px; left:12px; padding:0 5px; background:var(--blanco); color:var(--azul-700); font-size:12px; }
  .filtro input{ width:100%; padding:11px 13px; border:1px solid #b9c9d8; border-radius:8px; color:var(--gris-900); font-size:13px; outline:none; }
  .filtro input:focus{ border-color:var(--azul-500); box-shadow:0 0 0 3px rgba(47,107,171,.12); }
  .crud-table-wrap{ overflow-x:auto; padding:0 20px; }
  table.crud-table{ width:100%; min-width:620px; border-collapse:collapse; font-size:13px; }
  table.crud-table th{ padding:11px 12px; background:var(--azul-500); color:white; text-align:left; font-size:11.5px; letter-spacing:.02em; }
  table.crud-table th:first-child{ border-radius:8px 0 0 8px; }
  table.crud-table th:last-child{ border-radius:0 8px 8px 0; text-align:center; }
  table.crud-table td{ padding:11px 12px; border-bottom:1px solid #e7edf3; color:var(--gris-900); }
  table.crud-table tbody tr:hover td{ background:#f7fafc; }
  table.crud-table td:last-child{ text-align:center; }
  .crud-code{ color:var(--azul-700); font-weight:700; font-variant-numeric:tabular-nums; }
  .crud-status{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; }
  .crud-status:before{ content:''; width:7px; height:7px; border-radius:50%; background:#22a06b; }
  .crud-status.inactivo:before{ background:#9aa6b2; }
  .crud-status.inactivo{ color:var(--gris-600); }
  .crud-footer{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 20px 18px; }
  .crud-count{ color:var(--gris-600); font-size:12px; }
  .paginacion{ display:flex; align-items:center; gap:4px; }
  .pagina{ min-width:30px; height:30px; padding:0 8px; border:1px solid transparent; background:transparent; border-radius:6px; color:var(--gris-900); cursor:pointer; }
  .pagina:hover{ border-color:var(--gris-300); }
  .pagina.actual{ background:var(--azul-500); color:white; }
  .pagina:disabled{ color:#b6c0c9; cursor:not-allowed; }
  .modal-backdrop{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(15,42,74,.38); }
  .modal{ width:min(460px,100%); background:var(--blanco); border-radius:12px; box-shadow:0 18px 45px rgba(15,42,74,.25); }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--gris-300); }
  .modal-header h4{ margin:0; color:var(--azul-900); font-size:17px; }
  .modal-body{ display:grid; gap:15px; padding:20px; }
  .campo{ display:grid; gap:6px; }
  .campo label{ color:var(--gris-600); font-size:12px; font-weight:700; }
  .campo input,.campo select{ width:100%; padding:10px 11px; border:1px solid var(--gris-300); border-radius:7px; font-size:13px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; padding:15px 20px; border-top:1px solid var(--gris-300); }
  .sin-resultados{ padding:30px; text-align:center; color:var(--gris-600); }
  @media (max-width:600px){ .crud-heading,.crud-toolbar,.crud-footer{ align-items:stretch; flex-direction:column; } .crud-actions{ justify-content:space-between; } .crud-table-wrap{ padding:0 12px; } table.crud-table{ min-width:0; font-size:11px; table-layout:fixed; } table.crud-table th,table.crud-table td{ padding:10px 5px; overflow-wrap:anywhere; } table.crud-table th:first-child,table.crud-table td:first-child{ width:17%; } table.crud-table th:last-child,table.crud-table td:last-child{ width:15%; } .crud-code{ font-size:10px; } }

  /* INICIO POR PERFIL */
  .inicio{ max-width:980px; margin:0 auto; }
  .inicio-cabecera{ margin-bottom:16px; }
  .inicio-fecha{ margin:0 0 5px; color:var(--gris-600); font-size:12px; }
  .inicio-cabecera h2{ margin:0 0 4px; color:var(--azul-900); font-size:25px; }
  .inicio-cabecera p{ margin:0; color:var(--gris-600); font-size:13px; }
  
  .aviso-rol{ margin-bottom:22px; padding:11px 13px; border:1px solid #c8deef; border-radius:8px; background:#edf6fc; color:var(--azul-700); font-size:12px; }
  .aviso-rol b{ margin-left:4px; }
  .inicio-seccion{ margin-top:28px; }
  .inicio-seccion-titulo{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .inicio-seccion-titulo h3{ margin:0; color:var(--azul-900); font-size:15px; }
  .inicio-seccion-titulo span{ color:var(--gris-600); font-size:11px; }
  .inicio-kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .inicio-kpi{ padding:17px 18px; background:var(--blanco); border:1px solid var(--gris-300); border-top:3px solid var(--azul-500); border-radius:10px; box-shadow:var(--sombra); }
  .inicio-kpi strong{ display:block; color:var(--azul-700); font-size:24px; line-height:1.1; }
  .inicio-kpi span{ display:block; margin-top:5px; color:var(--gris-600); font-size:11.5px; }

function activarMenuInterno(){

    const boton = menu.querySelector('button');

      e.stopPropagation();
      const yaAbierto = menu.classList.contains('abierto');
      menus.forEach(x=>x.classList.remove('abierto'));
      if(!yaAbierto) menu.classList.add('abierto');
    });
  });

    a.addEventListener('click', (e)=>{
      e.preventDefault();

function renderCrudFichero(seccion, menuPadre){
  const config = CRUD_FICHEROS[seccion];
  let paginaActual = 1;
  const porPagina = 10;
  const vista = document.getElementById('vista-seccion');
  const renderTabla = (busqueda='')=>{
    const consulta = busqueda.trim().toLowerCase();
    const resultados = config.filas.filter(fila => Object.values(fila).join(' ').toLowerCase().includes(consulta));
    const totalPaginas = Math.max(1, Math.ceil(resultados.length / porPagina));
    paginaActual = Math.min(paginaActual, totalPaginas);
    const inicio = (paginaActual - 1) * porPagina;
    const visibles = resultados.slice(inicio, inicio + porPagina);
    const filas = visibles.length ? visibles.map((fila, indice)=>`
      <tr>
        <td class="crud-code">${fila.id}</td>
        <td>${fila.descripcion}</td>
        ${fila.uso ? `<td>${fila.uso}</td>` : ''}
        <td><span class="crud-status ${fila.activo === 'INACTIVO' ? 'inactivo' : ''}">${fila.activo}</span></td>
        <td><button class="btn-icono btn-editar" data-index="${config.filas.indexOf(fila)}" title="Editar registro" aria-label="Editar registro">✎</button></td>
      </tr>
    `).join('') : `<tr><td colspan="${config.columnas.length + 1}" class="sin-resultados">No se encontraron registros con ese filtro.</td></tr>`;
    const paginas = Array.from({length:totalPaginas}, (_,i)=>`<button class="pagina ${paginaActual === i+1 ? 'actual' : ''}" data-page="${i+1}">${i+1}</button>`).join('');
    vista.innerHTML = `
      <div class="crud-shell">
        <div class="migaja">Admisión <b>/ Ficheros</b> / ${seccion}</div>
        <div class="crud-heading">
          <div><h3>${seccion}</h3><p>${config.descripcion}</p></div>
          <div class="crud-actions"><button class="btn-secundario" id="btn-agregar">＋ Agregar</button><button class="btn-icono" id="btn-exportar" title="Exportar registros" aria-label="Exportar registros">▣</button></div>
        </div>
        <div class="crud-panel">
          <div class="crud-toolbar"><div class="filtro"><label for="filtro-crud">Filtrar (todos los campos)</label><input id="filtro-crud" type="search" placeholder="Escribe para buscar..." value="${busqueda}"></div><span class="crud-count">${resultados.length} registros</span></div>
          <div class="crud-table-wrap"><table class="crud-table"><thead><tr>${config.columnas.map(c=>`<th>${c}</th>`).join('')}<th>Editar</th></tr></thead><tbody>${filas}</tbody></table></div>
          <div class="crud-footer"><span class="crud-count">Mostrando ${visibles.length ? inicio + 1 : 0}-${Math.min(inicio + visibles.length, resultados.length)} de ${resultados.length}</span><div class="paginacion"><button class="pagina" id="pagina-anterior" ${paginaActual === 1 ? 'disabled' : ''}>‹</button>${paginas}<button class="pagina" id="pagina-siguiente" ${paginaActual === totalPaginas ? 'disabled' : ''}>›</button></div></div>
        </div>
      </div>
    `;
    document.getElementById('filtro-crud').addEventListener('input', e=>{ paginaActual=1; renderTabla(e.target.value); });
    document.getElementById('btn-agregar').addEventListener('click', ()=>abrirModalCrud(seccion, null, renderTabla));
    document.getElementById('btn-exportar').addEventListener('click', ()=>{ barraEstado.textContent=`Exportación de ${seccion} preparada (demo).`; });
    document.querySelectorAll('.btn-editar').forEach(btn=>btn.addEventListener('click', ()=>abrirModalCrud(seccion, Number(btn.dataset.index), renderTabla)));
    document.querySelectorAll('.pagina[data-page]').forEach(btn=>btn.addEventListener('click', ()=>{ paginaActual=Number(btn.dataset.page); renderTabla(document.getElementById('filtro-crud').value); }));
    document.getElementById('pagina-anterior').addEventListener('click', ()=>{ paginaActual--; renderTabla(document.getElementById('filtro-crud').value); });
    document.getElementById('pagina-siguiente').addEventListener('click', ()=>{ paginaActual++; renderTabla(document.getElementById('filtro-crud').value); });
  };
  renderTabla();
  barraEstado.textContent = `Admisión › Ficheros › ${seccion}`;
}

function abrirModalCrud(seccion, indice, alGuardar){
  const config = CRUD_FICHEROS[seccion];
  const siguienteId = String(Math.max(0, ...config.filas.map(fila=>Number(fila.id) || 0)) + 1);
  const existente = indice === null ? {id:seccion === 'Consultorios' ? siguienteId : '',descripcion:'',codigoIpress:'',uso:'CONSULTORIO',activo:'ACTIVO',modulo:''} : config.filas[indice];
  const campos = config.campos.map(([clave, etiqueta, tipo, oculto])=>{
    if(oculto) return `<input id="campo-${clave}" type="hidden" value="${existente[clave] || ''}">`;
    if(tipo === 'select'){
      const opciones = clave === 'uso' ? ['CONSULTORIO','QUIROFANO'] : ['ACTIVO','INACTIVO'];
      return `<div class="campo"><label for="campo-${clave}">${etiqueta}</label><select id="campo-${clave}">${opciones.map(op=>`<option ${existente[clave] === op ? 'selected' : ''}>${op}</option>`).join('')}</select></div>`;
    }
    return `<div class="campo"><label for="campo-${clave}">${etiqueta}</label><input id="campo-${clave}" type="${tipo}" value="${existente[clave]}" required></div>`;
  }).join('');
  const modal = document.createElement('div');
  modal.className='modal-backdrop';
  modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-modal"><div class="modal-header"><h4 id="titulo-modal">${indice === null ? 'Agregar' : 'Editar'} ${seccion}</h4><button class="btn-icono" id="cerrar-modal" aria-label="Cerrar">×</button></div><form id="form-crud"><div class="modal-body">${campos}</div><div class="modal-actions">${indice === null ? '' : '<button type="button" class="btn-peligro" id="eliminar-registro">Eliminar</button>'}<button type="button" class="btn-secundario" id="cancelar-modal">Cancelar</button><button type="submit" class="btn-primario">Guardar cambios</button></div></form></div>`;
  document.body.appendChild(modal);
  const cerrar=()=>modal.remove();
  modal.querySelector('#cerrar-modal').addEventListener('click', cerrar);
  modal.querySelector('#cancelar-modal').addEventListener('click', cerrar);
  modal.addEventListener('click', e=>{ if(e.target === modal) cerrar(); });
  if(indice !== null) modal.querySelector('#eliminar-registro').addEventListener('click', ()=>{
    if(!confirm(`¿Eliminar el registro ${existente.descripcion || existente.id}?`)) return;
    config.filas.splice(indice, 1);
    cerrar();
    alGuardar();
    barraEstado.textContent=`Registro eliminado de ${seccion} (demo).`;
  });
  modal.querySelector('#form-crud').addEventListener('submit', e=>{
    e.preventDefault();
    const registro={};
    config.campos.forEach(([clave])=>registro[clave]=modal.querySelector(`#campo-${clave}`).value.trim());
    if(indice === null) config.filas.unshift(registro); else config.filas[indice]=registro;
    cerrar();
    alGuardar();
    barraEstado.textContent=`${seccion} actualizado correctamente (demo).`;
  });
  const primerCampo = modal.querySelector('input:not([type="hidden"]), select');
  if(primerCampo) primerCampo.focus();
}

function renderDetalle(m){
  renderNav(m.id);

  if(m.id === 'admision' || m.id === 'caja' || m.id === 'emergencia' || m.id === 'hospitalizacion' || m.id === 'farmacia' || m.id === 'logistica' || m.id === 'quirurgico' || m.id === 'prequirurgico' || m.id === 'facturacion' || m.id === 'sig'){
    const menus = m.id === 'caja' ? MENU_CAJA : m.id === 'emergencia' ? MENU_EMERGENCIA : m.id === 'hospitalizacion' ? MENU_HOSPITALIZACION : m.id === 'logistica' ? MENU_LOGISTICA : m.id === 'quirurgico' ? MENU_QUIRURGICO : m.id === 'prequirurgico' ? MENU_PREQUIRURGICO : m.id === 'facturacion' ? MENU_FACTURACION : m.id === 'sig' ? MENU_SIG : MENU_ADMISION;
    contenido.innerHTML = `
      <div class="panel-detalle">
        <div class="panel-header">
          <h2>${m.icono}&nbsp; ${m.nombre}</h2>
          <button class="btn-volver" id="btn-volver">← Volver a Módulos</button>
        </div>
        ${renderMenuInterno(m, menus)}
      </div>
    `;
    document.getElementById('btn-volver').addEventListener('click', renderGridModulos);
    activarMenuInterno();
    barraEstado.textContent = `Viendo módulo: ${m.nombre}`;
    return;
  }

  const filasHtml = m.filas.map((fila, i)=>{
    const celdas = fila.slice(0,-1).map(c=>`<td>${c}</td>`).join('');
    const claseEstado = fila[fila.length-1];
    const textoEstado = m.estados[i];
    return `<tr>${celdas}<td><span class="estado ${claseEstado}">${textoEstado}</span></td></tr>`;
  }).join('');

  contenido.innerHTML = `
    <div class="panel-detalle">
      <div class="panel-header">
        <h2>${m.icono}&nbsp; ${m.nombre}</h2>
        <button class="btn-volver" id="btn-volver">← Volver a Módulos</button>
      </div>
      <div class="panel-body">
        <div class="kpis">
          ${m.kpis.map(([v,l])=>`<div class="kpi"><div class="valor">${v}</div><div class="etiqueta">${l}</div></div>`).join('')}
        </div>
        <div class="toolbar">
          <input type="text" id="buscador" placeholder="Buscar en ${m.nombre.toLowerCase()}...">
          <button class="btn-primario" id="btn-nuevo">+ Nuevo registro</button>
        </div>
        <table class="datos" id="tabla-datos">
          <thead><tr>${m.columnas.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${filasHtml}</tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('btn-volver').addEventListener('click', renderGridModulos);
  document.getElementById('btn-nuevo').addEventListener('click', ()=>{
    barraEstado.textContent = `Formulario de nuevo registro para ${m.nombre} (demo).`;
  });
  document.getElementById('buscador').addEventListener('input', (e)=>{
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('#tabla-datos tbody tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
  barraEstado.textContent = `Viendo módulo: ${m.nombre}`;
}

function irAModulo(id){
  const m = MODULOS.find(x=>x.id===id);
  if(!m || !m.activo || !modulosVisibles().some(x=>x.id===id)) return;
  renderDetalle(m);
}
